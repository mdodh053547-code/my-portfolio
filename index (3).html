<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>معرض أعمالي</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f8;--ink:#1a1730;--accent:#5b3df5;--card:#fff;--muted:#5d5a75}
@media (prefers-color-scheme:dark){:root{--bg:#121022;--ink:#ece9ff;--accent:#9b87ff;--card:#1b1833;--muted:#a9a5c8}}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.8}
main{max-width:900px;margin:0 auto;padding:56px 20px}
h1{font-size:clamp(2rem,6vw,3.2rem);margin:0 0 8px}
.lead{color:var(--muted);max-width:55ch}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-top:36px}
.project{background:var(--card);padding:22px;border-radius:14px;border-top:5px solid var(--accent)}
.project h2{margin:0 0 6px;font-size:1.2rem}
.project p{margin:0 0 14px;color:var(--muted)}
.project a{color:var(--accent);font-weight:600}
.project a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>
<h1>معرض أعمالي</h1>
<p class="lead">مشاريع بنيتها خلال مادة بناء ونشر المواقع بالذكاء الاصطناعي.</p>
<div class="grid">
<article class="project">
<h2>الموقع الشخصي</h2>
<p>صفحة تعريفية بمهاراتي وطرق التواصل معي.</p>
<a href="https://your-personal-site.pages.dev">افتح الموقع</a>
</article>
<article class="project">
<h2>الموقع التجاري</h2>
<p>موقع تعريفي لمطعم يعرض القائمة ومعلومات التواصل.</p>
<a href="https://your-business-site.pages.dev">افتح الموقع</a>
</article>
<article class="project">
<h2>مشروع ثالث</h2>
<p>اكتب وصفًا قصيرًا لما يفعله مشروعك.</p>
<a href="https://github.com/your-username/your-repo">المستودع</a>
</article>
</div>
</main>
</body>
</html>
